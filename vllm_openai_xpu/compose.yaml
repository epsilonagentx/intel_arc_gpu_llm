# UPSTREAM vLLM XPU engine — vllm/vllm-openai-xpu (not Intel's fork).
#
# Drop-in replacement for the `vllm` service in vllm_xpu/compose.yaml and the
# `vllm-scaler` service in scaler/compose.yaml: same model, same :8000.
#
# !! SINGLE GPU — run EXACTLY ONE of the three engines at a time.
# !! MEASURED on the B60 2026-09-09: 0.29.0 + V2 runner + the pinned pool below
# !! = 83.5 tok/s, 338,928-token KV pool (2.59x @128k), smoke ALL PASS.
# !! `restart: "no"` on purpose.
# Rationale, verified upstream facts, what to measure:  ./README.md
name: llm   # SAME project as vllm_xpu/scaler ON PURPOSE — shares the hf-cache volume

services:
  vllm-openai-xpu:
    # Upstream's own XPU image, separate Docker Hub repo from the CUDA one.
    # Here `latest` DOES track newest stable (unlike the Intel images).
    image: vllm/vllm-openai-xpu:v0.31.0
    container_name: vllm-openai-xpu
    restart: "no"            # evaluation engine — do not let it fight for the GPU
    # Whole /dev/dri + the by-path bind below are BOTH required, even at
    # world_size=1. This is upstream's documented recipe, not a local workaround.
    # (0.29.0 skips the oneCCL warm-up at world_size=1, so the bind may now be
    # redundant here — keep it until a boot without it proves otherwise.)
    # Root by default. Set VLLM_USER=1000:1000 (your `id -u`:`id -g`) and the
    # files it writes are yours. ../README.md "Volumes"
    user: "${VLLM_USER:-0:0}"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"   # host 'render' GID
      - "44"    # host 'video' GID
    ipc: host
    shm_size: "16g"
    volumes:
      - /dev/dri/by-path:/dev/dri/by-path:ro   # oneCCL device enumeration
      # Model weights. A named volume by default; set HF_CACHE to a host
      # folder to keep them there. ../README.md "Volumes"
      - ${HF_CACHE:-hf-cache}:/cache/huggingface   # shared with vllm_xpu/ + scaler/ — weights not re-downloaded
      # Compile cache — kernels are image-specific, so this engine gets its own.
      # Clear once after any image bump:
      #   docker compose down && docker volume rm llm_vllm-openai-cache
      - vllm-openai-cache:/cache/vllm
      # vLLM plugin that lets FLASH_ATTN take head size 512 on XPU. Inert unless
      # VLLM_ATTN_BACKEND=FLASH_ATTN.
      # ./GEMMA_4_26B_A4B.md "Intel attention for gemma-4"
      - ./head512_plugin:/opt/vllm-plugins:ro
    environment:
      HF_HOME: /cache/huggingface
      VLLM_CACHE_ROOT: /cache/vllm
      ZES_ENABLE_SYSMAN: "1"
      # MUST be 0 with the V2 runner below: 1 SEGFAULTS at boot inside the SYCL
      # persistent code-cache read. Costs a kernel rebuild each boot (~70 s
      # total). ./README.md "SYCL_CACHE_PERSISTENT=0"
      SYCL_CACHE_PERSISTENT: "${SYCL_CACHE_PERSISTENT:-0}"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"    # platform auto-sets this; explicit for parity
      no_proxy: "localhost,127.0.0.1"
      # V2 is upstream's default from 0.29.0 on, and MEASURED faster and leaner
      # here (+1.1% tok/s, non-torch 1.50 -> 1.03 GiB). 0 pins V1 for A/B work.
      # Integer only — a blank value crashes at boot, so the `:-1` is load-bearing.
      VLLM_USE_V2_MODEL_RUNNER: "${VLLM_USE_V2_MODEL_RUNNER:-1}"
      HF_TOKEN: "${HF_TOKEN:-}"                # empty = anonymous; no secret in this file
      PYTHONPATH: /opt/vllm-plugins            # where vLLM finds the head512 plugin above
    ports:
      - "8000:8000"          # same port as the other engines (only one runs at a time)
    # ENTRYPOINT is ["vllm","serve"], so command is ARGS ONLY — no shell wrapper
    # and no `vllm serve` prefix (this differs from scaler/compose.yaml).
    # !! --enforce-eager is REQUIRED BY THE 8.0 GiB PIN BELOW, not by 128k, and
    # NOT for the scaler's reason. Upstream defaults cudagraph_mode to NONE but
    # STILL runs torch.compile/Inductor (CompilationMode.VLLM_COMPILE). Those
    # buffers are not capped by gpu-memory-utilization, and with gpt-oss's pin
    # they starved the KV pool to 2.89 GiB and boot died needing 3.1 GiB.
    # gemma-4's smaller 4.25 GiB pin leaves headroom, so compiled mode boots
    # with the pool intact -- MEASURED at 32k, 64k AND 131,072 (2026-09-17).
    # The buffers scale with max-num-batched-tokens (2048; 2496 for gemma-4
    # with images on), NOT with context.
    # Set VLLM_EAGER_FLAG=--no-enforce-eager to take it; the flag is passed
    # whole because argparse builds this as a BooleanOptionalAction, so
    # `--enforce-eager=False` does NOT parse.
    # Prefill is UNCHANGED by it (on TRITON_ATTN still quadratic, exponent 2.048
    # measured -- that is the attention backend, not launch overhead).
    # From 0.31.0 compiled mode also captures XPU graphs; there is no longer
    # an environment variable to turn them off. ./README.md "Performance"
    command:
      - "${VLLM_MODEL:-openai/gpt-oss-20b}"
      - "--host=0.0.0.0"
      - "--port=8000"
      - "--max-model-len=${VLLM_MAX_MODEL_LEN:-131072}"
      - "--gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.80}"
      - "${VLLM_EAGER_FLAG:---enforce-eager}"
      # On the B60, util 0.80 alone strands ~4.5 GiB of the 22.71 GiB card (1.29x
      # pool). This is the byte value the V2 runner printed there for "fully utilize
      # gpu memory", MEASURED at 338,928 tokens / 2.59x @128k on ~0.15 GiB of
      # headroom — safe only because --enforce-eager caps compile buffers. Each
      # card needs its own value: ../INTEL_ARC_B60.md, ../INTEL_ARC_B70.md.
      # It is also RUNNER-SPECIFIC: V1 profiles a
      # different value (7117934592 -> 280,425 tok). To go back to util-based sizing,
      # comment this line OUT: a blank VLLM_KV_CACHE_MEMORY resolves to the default.
      # Canonical spelling: the log advises --kv-cache-memory, which parses only
      # as an argparse prefix abbreviation. ./README.md "--kv-cache-memory-bytes"
      - "--kv-cache-memory-bytes=${VLLM_KV_CACHE_MEMORY:-8603448832}"
      # Most requests at once. 256 is vLLM's own default. Qwen3.8 needs 128
      # with graphs: capture wants one linear-attention state block per
      # request, and its 8.0 GiB KV setting holds only 154.
      - "--max-num-seqs=${VLLM_MAX_NUM_SEQS:-256}"
      # Server-side default for chat-template variables, applied when a request
      # sends no chat_template_kwargs of its own. Turns gemma-4's opt-in
      # reasoning on globally: '{"enable_thinking":true}'. Default `null` is a
      # literal JSON null (the arg is parsed with json.loads) and is a no-op —
      # `null` not `{}` because a brace in a ${VAR:-default} breaks Compose
      # interpolation. No-op for gpt-oss, which always reasons.
      - "--default-chat-template-kwargs=${VLLM_DEFAULT_CHAT_TEMPLATE_KWARGS:-null}"
      - "--reasoning-parser=${VLLM_REASONING_PARSER:-openai_gptoss}"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=${VLLM_TOOL_CALL_PARSER:-openai}"
      # The id clients call it by. Keep it TRUTHFUL — one name per model, so a
      # swap is visible downstream rather than silently changing the model
      # behind a fixed label. A swap therefore requires updating the consumer's
      # model mapping; that is intentional, because the models differ in
      # context limit and prefill cost (see ../README.md and ./README.md).
      # Serving a second id is possible (the arg is nargs="+") but needs another
      # literal entry here — Compose cannot word-split one variable, and vLLM
      # does NOT dedupe, so a repeated name gets listed twice.
      - "--served-model-name=${VLLM_SERVED_MODEL_NAME:-gpt-oss-20b}"
      # Adds a `metrics` object (TTFT, tok/s, queue time) to every chat and
      # completions response. A stream carries it only in the final usage
      # chunk, so the client must send stream_options.include_usage.
      # ./README.md "Per-request stats"
      - "--enable-per-request-metrics"
      # Attention backend. `auto` lets vLLM choose (TRITON_ATTN for gemma-4,
      # FLASH_ATTN for gpt-oss and Qwen3.8). FLASH_ATTN runs gemma-4 on Intel's
      # own kernel: much faster prefill, and from 0.31.0 images still work.
      # --language-model-only turns image input off for ~5% more KV pool.
      # The text-only flag is passed whole, like VLLM_EAGER_FLAG.
      # ./GEMMA_4_26B_A4B.md "Intel attention for gemma-4"
      - "--attention-backend=${VLLM_ATTN_BACKEND:-auto}"
      - "${VLLM_TEXT_ONLY_FLAG:---no-language-model-only}"
      # Speculative decoding. `null` is off. gemma-4 uses Google's small draft
      # model; Qwen3.8 uses its own MTP head. Each about 1.7-2x faster decode.
      # ./GEMMA_4_26B_A4B.md "Faster decode with a draft model" and
      # ./QWEN3_8_27B.md "Faster decode: MTP and an FP8 output layer"
      - "--speculative-config=${VLLM_SPECULATIVE_CONFIG:-null}"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 3600s    # unknown cold-start cost on this engine; weights are cached

volumes:
  hf-cache:                # shared with vllm_xpu/ and scaler/ (project `llm`)
  vllm-openai-cache:       # compile cache for the upstream engine

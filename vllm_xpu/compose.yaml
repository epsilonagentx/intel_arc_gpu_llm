# Pin the Compose project name so cache volumes stay `llm_*` regardless of the
# folder this lives in (the repo dir is intel_arc_gpu_llm; without this the
# volumes would be recreated as intel_arc_gpu_llm_* and re-download the weights).
name: llm

services:
  vllm:
    image: intel/vllm:0.21.0-ubuntu24.04
    container_name: vllm-xpu
    restart: unless-stopped
    # 0.21.0 needs the WHOLE /dev/dri (plus the by-path bind-mount under volumes:).
    # oneCCL's ze_fd_manager opendir()s /dev/dri/by-path during the world_size=1
    # warm-up all_reduce, and Docker's `devices:` never recreates that symlink dir
    # -> without it boot dies ("oneCCL: ze_fd_manager.cpp:144 ... opendir failed").
    # The AMD iGPU nodes this also exposes are harmless (not SYCL XPUs). NOTE:
    # 0.17.0-xpu did NOT need this — it booted with only renderD128 + card1.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"   # host 'render' GID
      - "44"    # host 'video' GID
    ipc: host
    shm_size: "16g"
    volumes:
      - /dev/dri/by-path:/dev/dri/by-path:ro   # oneCCL device enumeration (see devices: above)
      - hf-cache:/root/.cache/huggingface
      # Compiled kernels are image-version-specific. When upgrading the image,
      # clear this cache ONCE (from this folder: `docker compose down`, then
      # `docker volume rm llm_vllm-cache`) so the new image compiles fresh — that
      # is the validated path. Steady state it self-fills and speeds restarts.
      - vllm-cache:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      # Don't restrict ONEAPI_DEVICE_SELECTOR; torch.compile/Inductor needs to
      # see all SYCL devices (CPU + GPU) to bring up its runtime.
      ZES_ENABLE_SYSMAN: "1"
      SYCL_CACHE_PERSISTENT: "1"
      no_proxy: "localhost,127.0.0.1"
    ports:
      - "8000:8000"
    # (No working_dir: 0.17.0-xpu had /workspace/vllm, but 0.21.0-ubuntu24.04 does
    # not ship it, and `vllm serve` needs no particular cwd.)
    # vLLM CLI serves an OpenAI-compatible API on /v1/*.
    # gpt-oss-20b (MoE, ~13.7 GiB MXFP4 weights) on a 24 GB B60 (22.71 GiB usable).
    # NOTE: gpu-memory-utilization sizes weights + the KV pool, but on this XPU
    # build it does NOT cap torch.compile/Inductor kernel + workspace buffers,
    # which grow as new request shapes get compiled. At 0.86 the card filled to
    # 22.67/22.71 GiB (0.04 free) -> OOM-on-the-edge, instability and 504s. So
    # 0.75 util (~17 GiB: ~13.7 weights + ~3.3 GiB KV pool) leaves ~2.5 GiB real
    # headroom for that uncapped compile growth. (The 0.86-OOM figure was measured
    # on 0.17.0-xpu; 0.75 was re-validated on 0.21.0 compiled — clean boot, KV pool
    # ~3.96 GiB, no OOM — so the ceiling carries over unchanged.)
    # max-model-len 65536 (64k): the model is natively 128k (YaRN,
    # max_position_embeddings=131072), but 64k is ample for chat and keeps the
    # reserved pool + activation buffers small. gpt-oss's alternating
    # sliding-window(128) + full-attention layers halve per-request KV cost, so
    # the ~3.3 GiB pool fits 64k with concurrency to spare. To go bigger later,
    # raise max-model-len AND re-check real VRAM headroom -- do NOT just bump util.
    # gpt-oss is reasoning-native (harmony format); the openai_gptoss parser
    # exposes the analysis channel as message.reasoning for clients like Open WebUI.
    # --- .env overrides --------------------------------------------------------
    # The ${VAR:-default} values are Compose-interpolated from `.env` IN THIS
    # FOLDER — Compose auto-reads it, no flags needed (that is why this file
    # lives in its own folder). No .env? The defaults below render exactly the
    # validated B60 command, so the file is fully runnable as-is. To override:
    #   cp .env.example .env   # then uncomment/edit values and `docker compose up -d`
    # Every variable is VALUE-ONLY: flag names live in this command, values come
    # from .env. Optional flags that are NOT part of the validated recipe are
    # catalogued in .env.example — each entry shows the exact `--flag ${VAR:-…}`
    # line to add to this command when you want it.
    command: >
      vllm serve ${VLLM_MODEL:-openai/gpt-oss-20b}
        --host 0.0.0.0
        --port 8000
        --max-model-len ${VLLM_MAX_MODEL_LEN:-65536}
        --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.75}
        --reasoning-parser ${VLLM_REASONING_PARSER:-openai_gptoss}
        --enable-auto-tool-choice
        --tool-call-parser ${VLLM_TOOL_CALL_PARSER:-openai}
        --served-model-name ${VLLM_SERVED_MODEL_NAME:-gpt-oss-20b}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 1800s   # first run downloads ~13 GB + loads model

# ============================================================================
# ALTERNATIVE ENGINE — Intel LLM-Scaler vLLM (Arc Pro B-series optimised fork)
# ============================================================================
# The scaler engine lives in its OWN folder, scaler/compose.yaml, and is a
# DROP-IN replacement for the `vllm` service above: same model, same published
# :8000, so anything fronting :8000 (gateway/UI) needs no change when you swap.
#
# !! ONE GPU (~22.7 GiB). gpt-oss-20b needs ~17 GiB, so the base `vllm` service
#    and the scaler service CANNOT run at the same time (~31 GiB = OOM). Run
#    exactly ONE at a time — the split into two folders makes that explicit.
#
#   Swap to the scaler engine (from the repo root; prod goes offline):
#     docker compose -f vllm_xpu/compose.yaml down       # stop base vLLM
#     docker compose -f scaler/compose.yaml up -d        # scaler on :8000
#   Swap back:
#     docker compose -f scaler/compose.yaml down
#     docker compose -f vllm_xpu/compose.yaml up -d
#
# Both files share `name: llm`, so the scaler reuses THIS project's hf-cache
# volume (`llm_hf-cache`) — the ~13 GB gpt-oss-20b weights are NOT re-downloaded.

# Open WebUI (optional chat UI) is intentionally NOT defined here. It runs as
# its own Compose project so it can be deployed and updated independently of the
# inference engine. See open_web_ui/compose.yaml and the README's
# "Running Open WebUI (optional)" section.

volumes:
  hf-cache:
  vllm-cache:

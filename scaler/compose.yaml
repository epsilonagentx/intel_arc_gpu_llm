# ALTERNATIVE INFERENCE ENGINE — Intel LLM-Scaler vLLM (Arc Pro B-series fork).
#
# Drop-in replacement for the `vllm` service in vllm_xpu/compose.yaml: same
# model, same port, so anything fronting :8000 needs no change when you swap.
#
# !! SINGLE GPU — run EITHER this OR vllm_xpu/compose.yaml, never both.
# Settings come from `.env` in this folder; ./.env.example lists them.
# Swap procedure and verification:  ../README.md
# Rationale, measurements, tested-and-rejected flags:  ./SCALER.md
name: llm   # SAME project as vllm_xpu ON PURPOSE — shares the hf-cache volume

services:
  vllm-scaler:
    # Exact pin — upstream says do NOT use :latest, and here `latest` still
    # resolves to a much older image. See ./SCALER.md §2.
    image: ${VLLM_IMAGE:-intel/llm-scaler-vllm:0.26.0-b2}
    container_name: vllm-scaler
    restart: "${VLLM_RESTART:-unless-stopped}"
    # Root by default. Set VLLM_USER=1000:1000 (your `id -u`:`id -g`) and the
    # files it writes are yours. ../README.md "Volumes"
    user: "${VLLM_USER:-0:0}"
    # Whole /dev/dri + the by-path bind below are BOTH required (oneCCL). ./SCALER.md §5
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-992}"   # host 'render' GID
      - "${VIDEO_GID:-44}"     # host 'video' GID
    ipc: host
    shm_size: "32g"          # per llm-scaler docs
    volumes:
      - /dev/dri/by-path:/dev/dri/by-path:ro   # oneCCL device enumeration
      # Model weights. A named volume by default; set HF_CACHE to a host
      # folder to keep them there. ../README.md "Volumes"
      - ${HF_CACHE:-hf-cache}:/cache/huggingface   # shared with vllm_xpu — weights not re-downloaded
      # Compile cache. Under --enforce-eager nothing is compiled, so this only
      # ever holds hash-guarded model metadata — no need to clear on an image
      # bump. Measured: ./SCALER.md §6
      - vllm-scaler-cache:/cache/vllm
    environment:
      HF_HOME: /cache/huggingface
      VLLM_CACHE_ROOT: /cache/vllm
      ZES_ENABLE_SYSMAN: "1"
      SYCL_CACHE_PERSISTENT: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      no_proxy: "localhost,127.0.0.1"
      # Online-quantization knobs — inert for MXFP4 gpt-oss-20b. ./SCALER.md §7
      # (the Q40 lib path is image-specific; verified present on this pin)
      VLLM_QUANTIZE_Q40_LIB: "/opt/venv/lib/python3.12/site-packages/vllm_int4_for_multi_arc.so"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      HF_TOKEN: "${HF_TOKEN:-}"        # empty = anonymous; no secret in this file
    ports:
      - "${VLLM_HOST_PORT:-8000}:8000"   # same port as the other engines (only one runs at a time)
    # Default entrypoint drops to a shell, so invoke `vllm serve` explicitly.
    entrypoint: ["/bin/bash", "-lc"]
    # Flag names live in this command, values come from .env. .env.example has
    # one block per model (gpt-oss-20b, Qwen3.8-27B); switch whole blocks.
    # !! --enforce-eager is MANDATORY, not a safe default: compiled mode boots
    # fine but silently returns EMPTY content+reasoning. Do not remove it
    # without re-verifying correctness. ./SCALER.md §4
    # VLLM_EXTRA_ARGS holds the flags only one model needs. Unset, it is
    # gpt-oss's KV size from the B60; set but empty, it adds nothing.
    command:
      - |
        vllm serve ${VLLM_MODEL:-openai/gpt-oss-20b} \
          --host 0.0.0.0 \
          --port 8000 \
          --max-model-len ${VLLM_MAX_MODEL_LEN:-131072} \
          --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.80} \
          --enforce-eager \
          --reasoning-parser ${VLLM_REASONING_PARSER:-openai_gptoss} \
          --enable-auto-tool-choice \
          --tool-call-parser ${VLLM_TOOL_CALL_PARSER:-openai} \
          --served-model-name ${VLLM_SERVED_MODEL_NAME:-gpt-oss-20b} \
          ${VLLM_EXTRA_ARGS---kv-cache-memory-bytes 8647520256}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 7200s    # covers a silent XPU cold start; 1800s suffices for gpt-oss

volumes:
  hf-cache:              # shared with vllm_xpu/compose.yaml (project `llm`)
  vllm-scaler-cache:     # compile cache for the llm-scaler engine

# ALTERNATIVE INFERENCE ENGINE — Intel LLM-Scaler vLLM (Arc Pro B-series fork).
#
# Drop-in replacement for the `vllm` service in vllm_xpu/compose.yaml: same
# model, same port, so anything fronting :8000 needs no change when you swap.
#
# !! SINGLE GPU — run EITHER this OR vllm_xpu/compose.yaml, never both.
# Swap procedure and verification:  ../README.md
# Rationale, measurements, tested-and-rejected flags:  ../SCALER_NOTES.md
name: llm   # SAME project as vllm_xpu ON PURPOSE — shares the hf-cache volume

services:
  vllm-scaler:
    # Exact pin — upstream says do NOT use :latest, and here `latest` and the
    # release notes both lag the newest tag. See ../SCALER_NOTES.md §2.
    image: intel/llm-scaler-vllm:0.26.0-b1
    container_name: vllm-scaler
    restart: unless-stopped
    # Whole /dev/dri + the by-path bind below are BOTH required (oneCCL). ../SCALER_NOTES.md §5
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "992"   # host 'render' GID
      - "44"    # host 'video' GID
    ipc: host
    shm_size: "32g"          # per llm-scaler docs
    volumes:
      - /dev/dri/by-path:/dev/dri/by-path:ro   # oneCCL device enumeration
      - hf-cache:/root/.cache/huggingface      # shared with vllm_xpu — weights not re-downloaded
      # Compile cache — kernels are image-specific, so clear this once after any
      # image bump: docker compose down && docker volume rm llm_vllm-scaler-cache
      - vllm-scaler-cache:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      ZES_ENABLE_SYSMAN: "1"
      SYCL_CACHE_PERSISTENT: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      no_proxy: "localhost,127.0.0.1"
      # Online-quantisation knobs — inert for MXFP4 gpt-oss-20b. ../SCALER_NOTES.md §7
      # (the Q40 lib path is image-specific; re-check it on an image bump)
      VLLM_QUANTIZE_Q40_LIB: "/opt/venv/lib/python3.12/site-packages/vllm_int4_for_multi_arc.so"
      VLLM_OFFLOAD_WEIGHTS_BEFORE_QUANT: "1"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      HF_TOKEN: "${HF_TOKEN:-}"        # empty = anonymous; no secret in this file
    ports:
      - "8000:8000"          # same port as the base engine (only one runs at a time)
    # Default entrypoint drops to a shell, so invoke `vllm serve` explicitly.
    entrypoint: ["/bin/bash", "-lc"]
    # !! --enforce-eager is MANDATORY, not a safe default: compiled mode boots
    # fine but silently returns EMPTY content+reasoning. Do not remove it
    # without re-verifying correctness. ../SCALER_NOTES.md §4
    # gpt-oss-20b is MXFP4 (pre-quantised) — do NOT pass --quantization.
    command:
      - |
        vllm serve openai/gpt-oss-20b \
          --host 0.0.0.0 \
          --port 8000 \
          --max-model-len 131072 \
          --gpu-memory-utilization 0.80 \
          --enforce-eager \
          --reasoning-parser openai_gptoss \
          --enable-auto-tool-choice \
          --tool-call-parser openai \
          --served-model-name gpt-oss-20b
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      retries: 60
      start_period: 7200s    # covers a silent XPU cold start; 1800s suffices for gpt-oss

volumes:
  hf-cache:              # shared with vllm_xpu/compose.yaml (project `llm`)
  vllm-scaler-cache:     # compile cache for the llm-scaler engine

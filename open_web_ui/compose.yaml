# Optional chat UI — Open WebUI — deployed as its OWN Compose project.
#
# Kept separate from the engine compose files (vllm_xpu/compose.yaml /
# scaler/compose.yaml) on purpose,
# so the UI can be deployed/updated independently and is never required to run
# the stack. Open WebUI is just ONE example of an OpenAI-compatible chat UI —
# swap in any client you prefer.
#
# !! LOCAL TESTING ONLY — NOT production-hardened. Auth is off (WEBUI_AUTH=false),
#    CORS is open (Open WebUI defaults CORS_ALLOW_ORIGIN to '*' and logs a warning
#    about it), and :3000 binds all interfaces. Before any real/shared use: set
#    WEBUI_AUTH=true, pin CORS_ALLOW_ORIGIN to your origin, and firewall or
#    localhost-bind the port.
#
#   Start (a vLLM engine must already be up — see vllm_xpu/compose.yaml).
#   From the repo root:
#     docker compose -f open_web_ui/compose.yaml up -d
#   Open:  http://localhost:3000     (auth disabled by default)
#   Logs:  docker compose -f open_web_ui/compose.yaml logs -f
#   Stop:  docker compose -f open_web_ui/compose.yaml down
#
# CONNECTIVITY: this is a separate Compose project, so it lives on its own
# Docker network and CANNOT reach vLLM by service name (http://vllm:8000). It
# instead talks to vLLM through the HOST's published port:
#   - Same host (default): host.docker.internal -> host gateway (Linux), so the
#     URL below hits the vllm container's published :8000.
#   - Different host: set OPENAI_API_BASE_URL to http://<vllm-host>:8000/v1.
#   - Scaler engine: no change needed — scaler/compose.yaml also publishes
#     :8000 (only one of the two engines runs at a time on the single GPU).
#
# Its own project name keeps the data volume predictable
# (open-webui_open-webui-data) instead of taking the checkout-folder name.
name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    container_name: open-webui
    restart: unless-stopped
    # A separate project = a separate network, so the vLLM service name does not
    # resolve here. host-gateway maps host.docker.internal to the host's gateway
    # IP (Docker Engine 20.10+ on Linux), letting us reach vLLM's published port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # vLLM's OpenAI-compatible endpoint, via the host's published :8000.
      # Remote vLLM host -> http://<vllm-host>:8000/v1. Works unchanged whether
      # the base or the scaler engine is up (both publish :8000).
      OPENAI_API_BASE_URL: "http://host.docker.internal:8000/v1"
      OPENAI_API_KEY: "EMPTY"           # vLLM doesn't require auth by default
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "false"
      ENABLE_SIGNUP: "false"
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      # Binds ALL interfaces. The UI has auth disabled — keep it off untrusted
      # networks: use "127.0.0.1:3000:8080" for localhost-only, or firewall it.
      - "3000:8080"

volumes:
  open-webui-data:

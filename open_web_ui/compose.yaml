# Optional chat UI — Open WebUI — deployed as its OWN Compose project.
#
# Kept separate from the engine compose files (vllm_xpu/compose.yaml /
# scaler/compose.yaml) on purpose,
# so the UI can be deployed/updated independently and is never required to run
# the stack. Open WebUI is just ONE example of an OpenAI-compatible chat UI —
# swap in any client you prefer.
#
# Settings come from `.env` in this folder; ./.env.example lists them. Without
# a `.env` the defaults below apply.
#
# !! LOCAL TESTING ONLY — NOT production-hardened. Auth is off, CORS is open
#    (Open WebUI defaults CORS_ALLOW_ORIGIN to '*' and logs a warning about
#    it), and :3000 binds all interfaces. Before any real/shared use, set these
#    in `.env`: OPEN_WEBUI_AUTH=true, OPEN_WEBUI_CORS_ALLOW_ORIGIN to your
#    origin, and OPEN_WEBUI_PORT=192.168.x.x:3000 (your host's LAN address),
#    plus a firewall rule for the port.
#
#   Start (a vLLM engine must already be up — see vllm_xpu/compose.yaml).
#   From the repo root:
#     docker compose -f open_web_ui/compose.yaml up -d
#   Open:  http://localhost:3000     (auth disabled by default)
#   Logs:  docker compose -f open_web_ui/compose.yaml logs -f
#   Stop:  docker compose -f open_web_ui/compose.yaml down
#
# CONNECTIVITY: this is a separate Compose project, so it lives on its own
# Docker network and CANNOT reach vLLM by service name (http://vllm:8000). It
# instead talks to vLLM through the HOST's published port:
#   - Same host (default): host.docker.internal -> host gateway (Linux), so the
#     URL below hits the vllm container's published :8000.
#   - Different host: set OPEN_WEBUI_API_BASE_URL in `.env` to
#     http://<vllm-host>:8000/v1.
#   - Swapping engines: no change needed — all three engine folders publish
#     :8000 and only one runs at a time on the single GPU, so this URL is
#     stable whichever of them is up.
#
# Its own project name keeps the data volume predictable
# (open-webui_open-webui-data) instead of taking the checkout-folder name.
name: open-webui

services:
  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.13.3}
    container_name: open-webui
    restart: unless-stopped
    # A separate project = a separate network, so the vLLM service name does not
    # resolve here. host-gateway maps host.docker.internal to the host's gateway
    # IP (Docker Engine 20.10+ on Linux), so it can reach vLLM's published port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # vLLM's OpenAI-compatible endpoint, via the host's published :8000.
      # Works unchanged whichever engine is up (all publish :8000).
      OPENAI_API_BASE_URL: "${OPEN_WEBUI_API_BASE_URL:-http://host.docker.internal:8000/v1}"
      OPENAI_API_KEY: "${OPEN_WEBUI_API_KEY:-EMPTY}"   # vLLM doesn't require auth by default
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "${OPEN_WEBUI_AUTH:-false}"
      ENABLE_SIGNUP: "${OPEN_WEBUI_SIGNUP:-false}"
      CORS_ALLOW_ORIGIN: "${OPEN_WEBUI_CORS_ALLOW_ORIGIN:-*}"
      # true (Open WebUI's default): the URL, key and signup values above are
      # saved on first start and later changes are ignored. ./.env.example
      ENABLE_PERSISTENT_CONFIG: "${OPEN_WEBUI_PERSISTENT_CONFIG:-true}"
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      # Binds ALL interfaces by default. The UI has auth disabled — keep it off
      # untrusted networks: OPEN_WEBUI_PORT=192.168.x.x:3000 binds your LAN
      # address only, and firewall it.
      - "${OPEN_WEBUI_PORT:-3000}:8080"

volumes:
  open-webui-data:
